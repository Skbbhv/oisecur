# Elke 5 minuten: controleer gemiste rondes en alleenwerkers die niet reageren.
# Nodig: repository secret OISECUR_CRON_SECRET (zelfde waarde als CRON_SECRET in Vercel).
name: Bewaking
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Controle uitvoeren
        env:
          GEHEIM: ${{ secrets.OISECUR_CRON_SECRET }}
        run: |
          if [ -z "$GEHEIM" ]; then echo "OISECUR_CRON_SECRET ontbreekt - overslaan"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $GEHEIM" "https://oisecur.nl/api/veld?actie=bewaking"
