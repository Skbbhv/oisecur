# Elke 5 minuten: controleer gemiste rondes en alleenwerkers die niet reageren,
# en stuur alleenwerkers een herinnering op hun telefoon.
# Werkt zonder instellingen. Optioneel: repository secret OISECUR_CRON_SECRET (= CRON_SECRET in Vercel).
name: Bewaking
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Controle uitvoeren
        env:
          GEHEIM: ${{ secrets.OISECUR_CRON_SECRET }}
        run: |
          if [ -n "$GEHEIM" ]; then H="Authorization: Bearer $GEHEIM"; else H="X-Bron: github"; fi
          curl -fsS --max-time 60 -H "$H" "https://oisecur.nl/api/veld?actie=bewaking"
