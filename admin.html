<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0e1522">
<meta name="robots" content="noindex, nofollow">
<title>Oisecur — Beheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1522;--panel:#161f31;--panel-2:#1d2940;--line:#2b3a57;--blauw:#1e6ff5;--blauw-licht:#6ea5ff;--red:#e5484d;--green:#2fbf71;--amber:#f5a524;--txt:#e8ecf3;--muted:#93a0b5}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--txt);font-family:'Barlow',system-ui,sans-serif;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--muted)}
a{color:var(--blauw-licht)}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;text-decoration:none;border-radius:9px;padding:10px 18px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.btn-primary{background:var(--blauw);color:#fff}.btn-primary:hover{background:#3d84ff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn-ghost:hover{border-color:var(--blauw);color:var(--blauw-licht)}
.btn-danger{background:transparent;border:1px solid #e5484d77;color:#ff8a8d}.btn-danger:hover{background:#e5484d22}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;font-size:15px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blauw)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--txt);margin-top:10px}
.check input{width:18px;height:18px;margin:0;accent-color:var(--blauw)}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.top{position:sticky;top:0;z-index:20;background:#0e1522f2;border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.top img{height:24px;display:block}
.top .tag{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);border:1px solid #f5a52466;border-radius:999px;padding:3px 10px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
@media(max-width:520px){.top-in{padding:10px 12px;gap:8px}.top .tag{display:none}.top .btn.sm{padding:6px 9px;font-size:13px}.toolbar input{max-width:none}.toolbar .btn{margin-left:0;width:100%}}

.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{font-size:22px;margin-bottom:6px}
.err{color:#ff8a8d;font-size:14px}
.err:empty{display:none}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:32px;line-height:1;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--amber)}.kpi.good b{color:#6fe0a4}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{margin:0;max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--blauw);color:var(--txt);background:#1e6ff522}
.chip b{color:var(--txt);margin-left:4px}
.toolbar .btn{margin-left:auto}

table{width:100%;border-collapse:collapse;font-size:14.5px}
thead th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--panel)}
td{padding:11px 10px;vertical-align:top}
td small{display:block;color:var(--muted);font-size:12.5px}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl tbody tr:hover{background:var(--panel-2)}
@media(max-width:760px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{padding:10px 6px}
  td{padding:3px 10px}
  td[data-l]::before{content:attr(data-l)': ';color:var(--muted);font-size:12.5px}
}
.badge{display:inline-block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 9px}
.b-proef{background:#f5a52422;color:#ffc56b}.b-verlopen{background:#e5484d26;color:#ff8a8d}
.b-starter{background:#6ea5ff22;color:var(--blauw-licht)}.b-pro{background:#1e6ff533;color:#9dc2ff}.b-business{background:#2fbf7126;color:#6fe0a4}
.b-blok{background:#e5484d;color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 16px}

#modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--ink);border-left:1px solid var(--line);width:100%;max-width:620px;height:100%;overflow:auto;padding:22px}
.drawer h2{font-size:26px}
.drawer .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.drawer .sec h3{font-size:16px;margin-bottom:10px;color:var(--blauw-licht)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px}
.kv span{display:block;color:var(--muted);font-size:12px}
.list{display:grid;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border-radius:8px;padding:8px 11px;font-size:14px}
.li small{color:var(--muted);font-size:12.5px;display:block}
.danger{border-color:#e5484d55!important}
.close{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:20px;color:var(--muted)}
.copybox{background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--red);background:#3a1418}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img id="logo" alt="Oisecur"><span class="tag">Beheer</span>
  <div class="right" id="top-right" hidden><button class="btn btn-ghost sm" id="b-ref">Vernieuwen</button><button class="btn btn-ghost sm" id="b-out">Uitloggen</button></div>
</div></header>

<section class="login" id="v-login">
  <form class="card stack" id="f-key">
    <h2>Beheer Oisecur</h2>
    <p class="muted" style="font-size:14px">Alleen voor jou. Log in met de beheersleutel die in Vercel staat als <span class="mono">OISECUR_ADMIN_KEY</span>.</p>
    <label>Beheersleutel<input type="password" id="key" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="remember"> Onthouden op dit apparaat</label>
    <p class="err" id="key-err"></p>
    <button class="btn btn-primary" style="width:100%">Inloggen</button>
  </form>
</section>

<main class="wrap" id="v-main" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Zoek op naam, code of e-mail…">
    <div class="chips" id="chips"></div>
    <button class="btn btn-primary sm" id="b-new">+ Nieuw bedrijf</button>
  </div>
  <div class="tbl"><table>
    <thead><tr><th>Bedrijf</th><th>Pakket</th><th>Beheerder</th><th>Gebruik</th><th>Laatste rapport</th><th>Klant sinds</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>

<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PRIJS = { starter: 19, pro: 49, business: 89, proef: 0 };
const PLAN_NAAM = { proef: 'Proef', starter: 'Starter', pro: 'Pro', business: 'Business' };
const BRANCHE = { beveiliging: 'Beveiliging', schoonmaak: 'Schoonmaak', facilitair: 'Facilitair', techniek: 'Techniek', evenementen: 'Evenementen', overig: 'Overig' };
const TYPE = { dienst: 'Dienst', incident: 'Melding', ronde: 'Ronde' };
let KEY = '', DATA = [], TODAY = new Date().toISOString().slice(0, 10), FILTER = 'alle';
$('#logo').src = LOGO;

function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 4500 : 2600); }
const fmt = iso => { if (!iso) return '—'; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}-${m}-${y}`; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
function status(b) {
  if (b.geblokkeerd) return 'geblokkeerd';
  if ((b.plan || 'pro') === 'proef') return b.proefTot && b.proefTot < TODAY ? 'verlopen' : 'proef';
  return 'betalend';
}
function planBadge(b) {
  const p = b.plan || 'pro', st = status(b);
  let h = '';
  if (p === 'proef') {
    const d = b.proefTot ? daysBetween(TODAY, b.proefTot) : null;
    h = st === 'verlopen' ? `<span class="badge b-verlopen">Proef verlopen</span><small>sinds ${fmt(b.proefTot)}</small>`
      : `<span class="badge b-proef">Proef</span><small>${d === null ? 'geen einddatum' : d === 0 ? 'laatste dag' : `nog ${d} dag${d === 1 ? '' : 'en'}`}</small>`;
  } else h = `<span class="badge b-${p}">${PLAN_NAAM[p] || p}</span><small>€${PRIJS[p] || 0} p/m</small>`;
  return (b.geblokkeerd ? '<span class="badge b-blok" style="margin-right:4px">Geblokkeerd</span>' : '') + h;
}
function randomPw() { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const a = crypto.getRandomValues(new Uint32Array(12)); a.forEach(n => s += c[n % c.length]); return s; }

async function api(body) {
  const res = await fetch('/api/admin', { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY }, body: body ? JSON.stringify(body) : undefined });
  const d = await res.json().catch(() => ({}));
  if (res.status === 401) { forget(); showLogin('De beheersleutel klopt niet (meer).'); throw new Error(d.fout || 'Ongeldige beheersleutel.'); }
  if (!res.ok) {
    if (res.status >= 500) {
      try { const s = await (await fetch('/api/status')).json(); if (s.database !== 'ok') throw new Error('Server kan de database niet bereiken (' + s.database.replace(/^fout: /, '') + '). Controleer REDIS_URL in Vercel.'); } catch (x) { if (x.message.startsWith('Server')) throw x; }
    }
    throw new Error(d.fout || `Fout ${res.status}`);
  }
  return d;
}
function remember(k, on) { try { (on ? localStorage : sessionStorage).setItem('ois_admin', k); } catch (e) {} }
function forget() { try { localStorage.removeItem('ois_admin'); sessionStorage.removeItem('ois_admin'); } catch (e) {} KEY = ''; }
function stored() { try { return localStorage.getItem('ois_admin') || sessionStorage.getItem('ois_admin') || ''; } catch (e) { return ''; } }
function showLogin(msg) { $('#v-login').hidden = false; $('#v-main').hidden = true; $('#top-right').hidden = true; $('#key-err').textContent = msg || ''; closeModal(); }

$('#f-key').onsubmit = async e => {
  e.preventDefault(); KEY = $('#key').value.trim(); if (!KEY) return;
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try { await load(); remember(KEY, $('#remember').checked); $('#key').value = ''; }
  catch (x) { $('#key-err').textContent = x.message; }
  btn.disabled = false;
};
$('#b-out').onclick = () => { forget(); showLogin(); };
$('#b-ref').onclick = () => load().then(() => toast('Bijgewerkt')).catch(x => toast(x.message, true));
$('#q').oninput = render;
$('#b-new').onclick = newCompany;

async function load() {
  const d = await api();
  DATA = d.bedrijven || []; if (d.vandaag) TODAY = d.vandaag;
  $('#v-login').hidden = true; $('#v-main').hidden = false; $('#top-right').hidden = false;
  render();
}
function render() {
  const cnt = s => DATA.filter(b => status(b) === s).length;
  const soon = DATA.filter(b => status(b) === 'proef' && b.proefTot && daysBetween(TODAY, b.proefTot) <= 3).length;
  const mrr = DATA.filter(b => status(b) === 'betalend').reduce((n, b) => n + (PRIJS[b.plan || 'pro'] || 0), 0);
  const rapp = DATA.reduce((n, b) => n + (b.rapporten || 0), 0);
  $('#kpis').innerHTML = `
    <div class="kpi good"><b>${cnt('betalend')}</b><span>Betalende klanten</span></div>
    <div class="kpi"><b>€${mrr.toLocaleString('nl-NL')}</b><span>Maandomzet (volgens pakket)</span></div>
    <div class="kpi"><b>${cnt('proef')}</b><span>Lopende proeven${soon ? ` · ${soon} bijna om` : ''}</span></div>
    <div class="kpi ${cnt('verlopen') ? 'warn' : ''}"><b>${cnt('verlopen')}</b><span>Proef verlopen</span></div>
    <div class="kpi"><b>${rapp.toLocaleString('nl-NL')}</b><span>Rapporten totaal</span></div>`;
  const F = [['alle', 'Alle', DATA.length], ['betalend', 'Betalend', cnt('betalend')], ['proef', 'Proef', cnt('proef')], ['verlopen', 'Verlopen', cnt('verlopen')], ['geblokkeerd', 'Geblokkeerd', cnt('geblokkeerd')]];
  $('#chips').innerHTML = F.map(([k, l, n]) => `<button class="chip${FILTER === k ? ' on' : ''}" data-f="${k}">${l}<b>${n}</b></button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(c => c.onclick = () => { FILTER = c.dataset.f; render(); });
  const q = $('#q').value.trim().toLowerCase();
  const list = DATA.filter(b => (FILTER === 'alle' || status(b) === FILTER) &&
    (!q || [b.naam, b.id, b.email, b.beheerder?.login, b.beheerder?.naam].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => (b.sinds || '').localeCompare(a.sinds || ''));
  $('#rows').innerHTML = list.length ? list.map(b => `<tr data-bid="${esc(b.id)}">
    <td><b>${esc(b.naam)}</b><small><span class="mono">${esc(b.id)}</span> · ${esc(BRANCHE[b.branche] || 'Beveiliging')}</small></td>
    <td data-l="Pakket">${planBadge(b)}</td>
    <td data-l="Beheerder">${esc(b.beheerder?.naam || '—')}<small>${esc(b.beheerder?.login || b.email || '')}</small></td>
    <td data-l="Gebruik">${b.users || 0} account${b.users === 1 ? '' : 's'}<small>${b.rapporten || 0} rapporten</small></td>
    <td data-l="Laatste rapport">${b.laatsteRapport ? fmt(b.laatsteRapport) : '—'}<small>${b.laatsteRapport ? `${daysBetween(b.laatsteRapport.slice(0, 10), TODAY)} dagen geleden` : 'nog niets gemaakt'}</small></td>
    <td data-l="Klant sinds">${fmt(b.sinds)}</td></tr>`).join('')
    : `<tr><td colspan="6" class="empty">${DATA.length ? 'Geen bedrijven met dit filter.' : 'Nog geen bedrijven.'}</td></tr>`;
  document.querySelectorAll('#rows tr[data-bid]').forEach(r => r.onclick = () => openCompany(r.dataset.bid));
}

function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="drawer">${html}</div>`; m.hidden = false; m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) closeModal(); }; }
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function openCompany(bid) {
  openModal('<p class="muted">Ophalen…</p>');
  let d; try { d = await api({ actie: 'detail', bid }); } catch (x) { closeModal(); return toast(x.message, true); }
  const b = d.bedrijf, row = DATA.find(x => x.id === bid) || {};
  openModal(`
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>${esc(b.naam)}</h2>
      <p class="muted"><span class="mono">${esc(b.id)}</span> · ${esc(BRANCHE[b.branche] || 'Beveiliging')}</p></div><button class="close" data-close aria-label="Sluiten">×</button></div>
    <div style="margin-top:8px">${planBadge({ ...b })}</div>

    <div class="sec"><h3>Gegevens</h3><div class="kv">
      <div><span>Beheerder</span>${esc(row.beheerder?.naam || '—')}</div>
      <div><span>E-mail / login</span>${row.beheerder?.login ? `<a href="mailto:${esc(row.beheerder.login)}">${esc(row.beheerder.login)}</a>` : esc(b.email || '—')}</div>
      <div><span>Klant sinds</span>${fmt(b.sinds)}</div>
      <div><span>Betalend sinds</span>${fmt(b.betaaldSinds)}</div>
      <div><span>Accounts</span>${d.gebruikers.length}</div>
      <div><span>Rapporten</span>${row.rapporten ?? '—'}</div>
      <div><span>Objecten / locaties</span>${d.objecten.length}</div>
      <div><span>Eigen logo</span>${b.heeftLogo ? 'Ja' : 'Nee'}</div>
    </div></div>

    <div class="sec"><h3>Pakket en proef</h3><div class="stack">
      <div class="row"><select id="d-plan" style="margin:0;max-width:220px">${Object.entries(PLAN_NAAM).map(([k, v]) => `<option value="${k}"${(b.plan || 'pro') === k ? ' selected' : ''}>${v}${PRIJS[k] ? ` · €${PRIJS[k]} p/m` : ''}</option>`).join('')}</select>
        <button class="btn btn-primary sm" id="d-plan-save">Pakket opslaan</button></div>
      <div class="row"><span class="muted" style="font-size:14px">Proef verlengen:</span>
        <button class="btn btn-ghost sm" data-proef="7">+7 dagen</button><button class="btn btn-ghost sm" data-proef="14">+14 dagen</button><button class="btn btn-ghost sm" data-proef="30">+30 dagen</button></div>
      <p class="muted" style="font-size:13px">Een verlopen proef kan niet meer inloggen; de gegevens blijven bewaard. Zet het pakket op Starter, Pro of Business zodra de klant betaalt.</p>
    </div></div>

    <div class="sec"><h3>Toegang</h3>
      <p class="muted" style="font-size:14px;margin-bottom:10px">${b.geblokkeerd ? 'Dit bedrijf is geblokkeerd: niemand kan inloggen.' : 'Iedereen van dit bedrijf kan inloggen.'}</p>
      <button class="btn ${b.geblokkeerd ? 'btn-primary' : 'btn-danger'} sm" id="d-blok">${b.geblokkeerd ? 'Blokkade opheffen' : 'Blokkeren'}</button>
    </div>

    <div class="sec"><h3>Gebruikers (${d.gebruikers.length})</h3><div class="list">${d.gebruikers.map(u => `<div class="li"><div>${esc(u.naam)}${u.rol === 'beheerder' ? ' <span class="badge b-pro">beheerder</span>' : ''}<small>${esc(u.login)}${u.pnr ? ' · ' + esc(u.pnr) : ''}</small></div>
      <button class="btn btn-ghost sm" data-pw="${esc(u.login)}">Nieuw wachtwoord</button></div>`).join('') || '<p class="muted">Geen gebruikers.</p>'}</div>
      <div id="pw-out" style="margin-top:10px"></div></div>

    <div class="sec"><h3>Objecten / locaties (${d.objecten.length})</h3><div class="list">${d.objecten.map(o => `<div class="li"><div>${esc(o.naam)}<small>${o.checkpoints} checkpoints${o.email ? ' · ' + esc(o.email) : ''}${o.portaal ? ' · portaal actief' : ''}</small></div></div>`).join('') || '<p class="muted">Nog geen objecten.</p>'}</div></div>

    <div class="sec"><h3>Laatste rapporten</h3><div class="list">${d.rapporten.map(r => `<div class="li"><div><span class="mono" style="font-size:12.5px">${esc(r.nummer)}</span><small>${TYPE[r.type] || r.type} · ${fmt(r.datum)} · ${esc(r.object)} · ${esc(r.naam)}</small></div></div>`).join('') || '<p class="muted">Nog geen rapporten.</p>'}</div></div>

    <div class="sec"><h3>Notitie (alleen voor jou)</h3>
      <textarea id="d-notitie" rows="3" placeholder="bijv. factuur verstuurd, contactpersoon, afspraken…">${esc(b.notitie || '')}</textarea>
      <button class="btn btn-ghost sm" id="d-not-save" style="margin-top:8px">Notitie opslaan</button></div>

    <div class="sec danger"><h3 style="color:#ff8a8d">Bedrijf verwijderen</h3>
      <p class="muted" style="font-size:14px">Verwijdert het bedrijf met alle accounts, rapporten, foto's en portaallinks. Dit kan niet ongedaan worden gemaakt.</p>
      <div class="row" style="margin-top:10px"><input id="d-del-code" placeholder="Typ ${esc(b.id)} ter bevestiging" style="margin:0;max-width:260px"><button class="btn btn-danger sm" id="d-del">Definitief verwijderen</button></div></div>`);

  const act = async (body, msg) => { try { const r = await api({ bid, ...body }); toast(msg); await load(); return r; } catch (x) { toast(x.message, true); } };
  $('#d-plan-save').onclick = async () => { await act({ actie: 'plan', plan: $('#d-plan').value }, 'Pakket opgeslagen'); openCompany(bid); };
  document.querySelectorAll('[data-proef]').forEach(bt => bt.onclick = async () => { const r = await act({ actie: 'proef', dagen: +bt.dataset.proef }, 'Proef verlengd'); if (r) toast(`Proef loopt nu tot ${fmt(r.proefTot)}`); openCompany(bid); });
  $('#d-blok').onclick = async () => {
    if (!b.geblokkeerd && !confirm(`${b.naam} blokkeren? Niemand van dit bedrijf kan dan nog inloggen.`)) return;
    await act({ actie: 'blokkeer', aan: !b.geblokkeerd }, b.geblokkeerd ? 'Blokkade opgeheven' : 'Bedrijf geblokkeerd'); openCompany(bid);
  };
  $('#d-not-save').onclick = () => act({ actie: 'notitie', notitie: $('#d-notitie').value }, 'Notitie opgeslagen');
  document.querySelectorAll('[data-pw]').forEach(bt => bt.onclick = async () => {
    const login = bt.dataset.pw, pw = randomPw();
    if (!confirm(`Nieuw wachtwoord maken voor ${login}? Het oude werkt dan niet meer.`)) return;
    try { await api({ actie: 'wachtwoord', bid, login, wachtwoord: pw });
      const txt = `Inloggen op Oisecur\nAdres: ${location.origin}/app.html\nLogin: ${login}\nWachtwoord: ${pw}`;
      $('#pw-out').innerHTML = `<div class="copybox">${esc(txt)}</div><button class="btn btn-ghost sm" id="pw-copy" style="margin-top:8px">Kopiëren</button>`;
      $('#pw-copy').onclick = () => navigator.clipboard.writeText(txt).then(() => toast('Gekopieerd'), () => toast('Kopiëren lukt niet; selecteer de tekst zelf.', true));
      toast('Nieuw wachtwoord ingesteld');
    } catch (x) { toast(x.message, true); }
  });
  $('#d-del').onclick = async () => {
    const code = $('#d-del-code').value.trim().toUpperCase();
    if (code !== b.id) return toast(`Typ ${b.id} om te bevestigen.`, true);
    if (!confirm(`Echt ${b.naam} met ALLE gegevens verwijderen?`)) return;
    try { await api({ actie: 'verwijder', bid, bevestig: code }); closeModal(); toast('Bedrijf verwijderd'); await load(); } catch (x) { toast(x.message, true); }
  };
}

function newCompany() {
  const pw = randomPw();
  openModal(`
    <div class="row" style="justify-content:space-between"><h2>Nieuw bedrijf</h2><button class="close" data-close aria-label="Sluiten">×</button></div>
    <form id="f-new" class="sec stack">
      <label>Bedrijfsnaam<input name="naam" required placeholder="Voorbeeld Beveiliging B.V."></label>
      <div class="grid2"><label>Bedrijfscode (komt in rapportnummers)<input name="id" required maxlength="8" style="text-transform:uppercase" placeholder="VBBV"></label>
        <label>Branche<select name="branche">${Object.entries(BRANCHE).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>
      <label>Pakket<select name="plan">${Object.entries(PLAN_NAAM).map(([k, v]) => `<option value="${k}"${k === 'pro' ? ' selected' : ''}>${v}${PRIJS[k] ? ` · €${PRIJS[k]} p/m` : ' · 14 dagen gratis'}</option>`).join('')}</select></label>
      <div class="grid2"><label>Naam beheerder<input name="beheerderNaam" required></label><label>Login beheerder (e-mail)<input name="login" required autocapitalize="none"></label></div>
      <label>Wachtwoord<input name="wachtwoord" required minlength="8" value="${pw}"></label>
      <p class="err" id="new-err"></p>
      <button class="btn btn-primary">Bedrijf aanmaken</button>
    </form><div id="new-out"></div>`);
  const f = $('#f-new');
  f.naam.addEventListener('input', () => { if (!f.id.dataset.touched) f.id.value = f.naam.value.toUpperCase().replace(/B\.?V\.?$/, '').replace(/[^A-Z0-9]/g, '').slice(0, 6); });
  f.id.addEventListener('input', () => f.id.dataset.touched = '1');
  f.onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(f)); $('#new-err').textContent = '';
    if (v.wachtwoord.length < 8) return $('#new-err').textContent = 'Wachtwoord: minimaal 8 tekens.';
    try {
      const r = await api({ ...v, id: v.id.toUpperCase().trim(), naam: v.naam.trim(), beheerderNaam: v.beheerderNaam.trim(), login: v.login.trim() });
      const txt = `Welkom bij Oisecur!\n\nAdres: ${location.origin}/app.html\nLogin: ${v.login.trim().toLowerCase()}\nWachtwoord: ${v.wachtwoord}\n\nNa het inloggen zet je je locaties en team erin.`;
      f.hidden = true;
      $('#new-out').innerHTML = `<div class="sec"><h3>Aangemaakt: ${esc(r.bid)}</h3><p class="muted" style="font-size:14px;margin-bottom:10px">Stuur deze gegevens naar de klant:</p><div class="copybox">${esc(txt)}</div>
        <div class="row" style="margin-top:10px"><button class="btn btn-primary sm" id="new-copy">Kopiëren</button><button class="btn btn-ghost sm" data-close>Sluiten</button></div></div>`;
      $('#new-copy').onclick = () => navigator.clipboard.writeText(txt).then(() => toast('Gekopieerd'), () => toast('Kopiëren lukt niet; selecteer de tekst zelf.', true));
      await load();
    } catch (x) { $('#new-err').textContent = x.message; }
  };
}

(async () => { KEY = stored(); if (KEY) { try { await load(); } catch (x) { showLogin(x.message); } } })();
</script>
</body>
</html>
