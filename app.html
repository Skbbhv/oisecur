<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oisecur — Rapportage</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e1522">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1522;--panel:#161f31;--panel-2:#1d2940;--line:#2b3a57;--paper:#f7f8fa;
  --blauw:#1e6ff5;--blauw-licht:#6ea5ff;--navy:#0d2456;--red:#e5484d;--green:#2fbf71;--amber:#f5a524;
  --txt:#e8ecf3;--muted:#93a0b5;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--txt);font-family:'Barlow',system-ui,sans-serif;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
a{color:inherit}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.mono{font-family:'IBM Plex Mono',monospace}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;text-decoration:none;border-radius:9px;padding:11px 20px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.btn-primary{background:var(--blauw);color:#fff}
.btn-primary:hover{background:#3d84ff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:var(--blauw);color:var(--blauw-licht)}
.btn-danger{background:transparent;border:1px solid #e5484d66;color:#ff8a8d}
.btn-danger:hover{background:#e5484d22}
.btn.sm{padding:8px 14px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;margin-top:14px}

label{display:block;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;font-size:16px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blauw)}
input:disabled{opacity:.6}
textarea{resize:vertical;min-height:44px}
input[type=checkbox]{width:20px;height:20px;display:inline-block;margin:0;vertical-align:middle;accent-color:var(--blauw)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--txt);padding:6px 0;cursor:pointer}
input[type=date],input[type=time]{color-scheme:dark;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}.grid2.keep{grid-template-columns:1fr 1fr}}
form > * + *, .stack > * + *{margin-top:12px}

/* Welkom / inloggen */
.welcome{min-height:100vh}
.w-in{max-width:1080px;margin:0 auto;padding:0 18px}
.w-top{position:sticky;top:0;z-index:30;background:rgba(14,21,34,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.w-top .w-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:10px;padding-bottom:10px}
.w-top nav{display:flex;align-items:center;gap:18px}
.w-top nav a:not(.btn){text-decoration:none;color:var(--muted);font-size:15px}
.w-top nav a:not(.btn):hover{color:var(--txt)}
@media(max-width:560px){.w-top nav a:not(.btn){display:none}}
.eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blauw-licht);border:1px solid #1e6ff555;border-radius:999px;padding:5px 13px;margin-bottom:16px}
.w-hero{padding:52px 0 60px;position:relative;overflow:hidden}
.w-hero::before{content:"";position:absolute;inset:-30% -15% auto auto;width:65%;height:110%;background:radial-gradient(closest-side,#1e6ff522,transparent 70%);pointer-events:none}
.w-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;position:relative}
@media(max-width:860px){.w-grid{grid-template-columns:1fr;gap:32px}}
.w-intro h1{font-size:clamp(34px,5.4vw,56px);font-weight:700;margin-bottom:16px}
.w-intro h1 em{font-style:normal;color:var(--blauw-licht)}
.w-lead{font-size:17.5px;color:var(--muted);max-width:54ch;margin-bottom:20px}
.w-checks{list-style:none;display:grid;gap:9px;margin-bottom:24px}
.w-checks li{padding-left:26px;position:relative;font-size:15.5px}
.w-checks li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}
.auth-card{width:100%;max-width:420px;justify-self:end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;text-align:center;box-shadow:0 30px 60px -30px #000c;scroll-margin:90px}
@media(max-width:860px){.auth-card{justify-self:center}}
.auth-card form{text-align:left}
.auth-card h2{font-size:24px;margin-bottom:2px}
.w-sec{padding:64px 0}
.w-sec h2,.w-cta h2{font-size:clamp(28px,4vw,38px);margin-bottom:10px}
.w-sub{color:var(--muted);font-size:16px;max-width:62ch;margin-bottom:26px}
.w-alt{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.w-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
@media(max-width:860px){.w-feat{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.w-feat{grid-template-columns:1fr}}
.w-feat article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.w-ic{width:40px;height:40px;border-radius:9px;background:#1e6ff51c;border:1px solid #1e6ff544;display:grid;place-items:center;margin-bottom:12px;color:var(--blauw-licht)}
.w-ic svg{width:20px;height:20px}
.w-feat h3{font-size:19px;margin-bottom:6px}
.w-feat p{font-size:14.5px;color:var(--muted)}
.w-branches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.w-branches{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.w-branches{grid-template-columns:1fr}}
.w-branches > div{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.w-branches h3{font-size:18px;margin-bottom:9px}
.w-types{display:flex;flex-wrap:wrap;gap:6px}
.w-types span{font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:var(--blauw-licht);background:#1e6ff51a;border:1px solid #1e6ff540;border-radius:6px;padding:3px 8px}
.w-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
@media(max-width:760px){.w-steps{grid-template-columns:1fr}}
.w-steps > div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.w-steps b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blauw);color:#fff;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:19px;margin-bottom:12px}
.w-steps h3{font-size:19px;margin-bottom:6px}
.w-steps p{font-size:14.5px;color:var(--muted)}
.w-cta{padding:60px 0;text-align:center;background:linear-gradient(160deg,var(--navy),#0e1522 70%);border-top:1px solid var(--line)}
.w-cta p{color:var(--muted);margin-bottom:22px}
.w-foot{border-top:1px solid var(--line);padding:24px 0;font-size:13.5px;color:var(--muted)}
.w-foot .w-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.w-foot a{color:var(--muted)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Shell */
.demobar{background:var(--amber);color:#1a1200;text-align:center;font-size:13.5px;font-weight:600;padding:7px 12px}
.demobar a{color:#1a1200}
.top{position:sticky;top:0;z-index:40;background:rgba(14,21,34,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand .logo{height:24px;width:auto;display:block}
.brand b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase}
.brand b span{color:var(--blauw-licht)}
.company{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-size:15px;font-weight:500;padding:8px 12px;border-radius:8px}
.tabs a:hover{color:var(--txt);background:var(--panel)}
.tabs a.on{color:var(--txt);background:var(--panel-2)}
.tabs svg{width:18px;height:18px;flex:none}
@media(max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:#0e1522}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(14,21,34,.97);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin:0;z-index:45}
  .tabs a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1}
  .tabs svg{width:22px;height:22px}
  .tabs a.on{background:none;color:var(--blauw-licht)}
  body.app{padding-bottom:80px}
}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:clamp(26px,5vw,34px)}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card + .card{margin-top:14px}
.card h2{font-size:19px;margin-bottom:12px}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-t h2{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.warn{background:#f5a52418;border:1px solid #f5a52455;color:#ffd08a;border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.warn a{color:#ffd08a}

/* Overzicht */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:620px){.quick{grid-template-columns:1fr}}
.quick a{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.quick a:hover{border-color:var(--blauw)}
.quick .qi{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px}
.quick b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:19px;text-transform:uppercase;display:block;line-height:1.1}
.quick small{color:var(--muted);font-size:13px}
.qi.dienst{background:#1e6ff522;color:var(--blauw-licht)}
.qi.incident{background:#e5484d22;color:#ff8a8d}
.qi.ronde{background:#2fbf7122;color:#6fe0a4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:32px;line-height:1;display:block}
.stat span{font-size:13px;color:var(--muted)}
@media(max-width:520px){.stat b{font-size:26px}.stat span{font-size:12px}}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filters input,.filters select{margin:0}
@media(max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
.rlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.rcard{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blauw);border-radius:10px;padding:13px 15px}
.rcard:hover{border-color:var(--blauw-licht)}
.rcard.incident{border-left-color:var(--red)}
.rcard.ronde{border-left-color:var(--green)}
.rcard .l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rcard .l1 b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:17px;text-transform:uppercase}
.rcard .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.rcard .l2{font-size:14px;margin-top:3px}
.rcard .l3{font-size:13.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 9px;margin-left:auto}
.pill.concept{background:#f5a52422;color:#ffc56b}
.pill.definitief{background:#2fbf7122;color:#6fe0a4}
.pill.hoog{background:#e5484d33;color:#ff8a8d}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:12px}

/* Editor */
.entry{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:start;margin-bottom:8px}
.entry input,.entry textarea{margin:0}
.x{background:none;border:1px solid var(--line);border-radius:8px;height:44px;cursor:pointer;color:var(--muted);font-size:20px}
.x:hover{border-color:var(--red);color:#ff8a8d}
.cp{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--ink)}
.cp.ok{border-color:#2fbf7166}.cp.afwijking{border-color:#e5484d88}.cp.overgeslagen{border-color:#f5a52466}
.cp-top{display:flex;gap:8px;align-items:center}
.cp-top input{margin:0;font-weight:600}
.cp-meta{font-size:12.5px;color:var(--muted);margin-top:8px;font-family:'IBM Plex Mono',monospace}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 8px;cursor:pointer;font-size:14px;font-weight:500}
.seg button.on.ok{background:#2fbf7126;border-color:var(--green);color:#6fe0a4}
.seg button.on.afwijking{background:#e5484d26;border-color:var(--red);color:#ff8a8d}
.seg button.on.overgeslagen{background:#f5a52426;border-color:var(--amber);color:#ffc56b}
.cp textarea{margin-top:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.photos figure{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .del{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:none;background:#000a;color:#fff;cursor:pointer;font-size:17px}
.sigwrap{background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#sig{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair}
.savebar{position:sticky;bottom:0;background:rgba(14,21,34,.96);border-top:1px solid var(--line);padding:12px 0;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;z-index:5}
@media(max-width:760px){.savebar{bottom:64px}}
.savebar .btn{flex:1}
.savebar{flex-wrap:nowrap}
.savebar .btn-ghost{flex:0 0 auto}
@media(max-width:520px){.savebar{padding:10px 0;gap:8px}.savebar .btn{padding:11px 12px;font-size:15px}}

/* Rapportweergave */
.paper{background:var(--paper);color:#16181c;border-radius:12px;padding:24px;max-width:780px}
.paper .ph{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.paper .ph img{max-height:48px;max-width:160px;display:block;margin-bottom:8px}
.paper h2{color:var(--navy);font-size:24px;text-transform:uppercase}
.paper h3{color:var(--navy);font-size:16px;margin:18px 0 8px;border-bottom:1px solid #d9dde4;padding-bottom:4px}
.paper .nr{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#555;text-align:right}
.paper .st{display:inline-block;border:2px solid var(--navy);color:var(--navy);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;text-transform:uppercase;font-size:12px;padding:1px 8px;margin-top:5px;letter-spacing:.08em}
.paper .st.concept{border-color:#b7791f;color:#b7791f}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:14px}
@media(max-width:520px){.kv{grid-template-columns:1fr}}
.kv span{display:block;color:#6b7280;font-size:12px}
.kv b{font-weight:600}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{text-align:left;color:var(--navy);font-size:12px;text-transform:uppercase;border-bottom:2px solid var(--navy);padding:5px 6px}
.paper td{padding:7px 6px;border-bottom:1px solid #e2e5ea;vertical-align:top}
.paper td.t{font-family:'IBM Plex Mono',monospace;white-space:nowrap;color:var(--navy)}
.paper p.pre{white-space:pre-wrap;font-size:14px}
.paper .lbl{font-size:12px;color:#6b7280;margin-top:10px}
.paper .photos figure{border-color:#d9dde4}
.paper .sig img{max-width:260px;display:block;border-bottom:1px solid #999}
.s-ok{color:#15803d;font-weight:600}.s-afwijking{color:#c1121f;font-weight:600}.s-overgeslagen{color:#b7791f;font-weight:600}

/* Lijsten */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;text-decoration:none}
a.item:hover{border-color:var(--blauw)}
.item .grow{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person{display:grid;grid-template-columns:1fr 160px 44px;gap:8px;align-items:end;margin-bottom:10px}
.person input{margin-top:5px}
@media(max-width:520px){.person{grid-template-columns:1fr 1fr 44px}}
.logo-prev{background:#fff;border-radius:8px;padding:10px;display:inline-block;margin-top:8px}
.logo-prev img{max-height:60px;max-width:220px;display:block}

/* Modal + toast */
#modal{position:fixed;inset:0;background:#000b;z-index:100;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal-box h2{font-size:21px;margin-bottom:6px}
.scanwrap{position:relative;border-radius:10px;overflow:hidden;background:#000;margin:12px 0;aspect-ratio:1}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanwrap::after{content:"";position:absolute;inset:18%;border:3px solid #ffffffcc;border-radius:14px;box-shadow:0 0 0 999px #0006}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--red);background:#3a1418}
@media(max-width:760px){#toast{bottom:92px}}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.form-err{color:#ff8a8d;font-size:14px;min-height:0}
.form-err:empty{display:none}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ═════════════ Server ═════════════ */
class ApiError extends Error { constructor(m, s) { super(m); this.status = s; } }
async function serverApi(pad, body) {
  const opts = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers.Authorization = 'Bearer ' + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  let res;
  try { res = await fetch('/api/' + pad, opts); }
  catch (e) { throw new ApiError('Geen verbinding met de server. Controleer je internet en probeer het opnieuw.', 0); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && TOKEN && pad !== 'auth') sessionExpired();
    throw new ApiError(data.fout || `Er ging iets mis (${res.status}).`, res.status);
  }
  return data;
}
const call = (pad, body) => (MODE === 'demo' ? demoApi(pad, body) : serverApi(pad, body));
function sessionExpired() {
  TOKEN = null; Store.set('ois_sessie', null);
  closeModal(); welcome('login');
  toast('Je sessie is verlopen. Log opnieuw in.', true);
}
async function loadAll() {
  const d = await call('stamdata');
  B = d.bedrijf; if (!B.branche) B.branche = 'beveiliging';
  OBJ = d.objecten || []; DIENST = d.diensten || []; MW = d.medewerkers || [];
  ME.rol = d.rol;
  await loadList();
}
async function loadList() { LIST = (await call('rapporten')).rapporten || []; }
async function getReport(nummer) {
  if (!CACHE[nummer]) CACHE[nummer] = await call('rapporten?nummer=' + encodeURIComponent(nummer));
  return CACHE[nummer];
}

/* ═════════════ Demo: nagebootste server in het geheugen ═════════════ */
let DEMO = null;
function demoApi(pad, body) {
  return new Promise((res, rej) => setTimeout(() => {
    try { res(clone(demoHandle(pad, body ? clone(body) : null))); } catch (e) { rej(e); }
  }, 80));
}
function summaryOf(r) {
  return { nummer: r.nummer, type: r.type, naam: r.naam, object: r.object, datum: r.datum,
    aantal: r.type === 'dienst' ? (r.mutaties || []).length : r.type === 'ronde' ? ((r.ronde || {}).punten || []).length : ((r.incident || {}).cat || ''), door: r.door };
}
function demoHandle(pad, b) {
  const [path, qs] = pad.split('?'); const q = new URLSearchParams(qs || ''); const D = DEMO;
  if (path === 'auth' || path === 'verstuur') return { ok: true };
  if (path === 'stamdata') {
    if (!b) return { rol: 'beheerder', bedrijf: D.bedrijf, objecten: D.objecten, diensten: D.diensten, medewerkers: D.users };
    const login = String(b.login || '').toLowerCase().trim();
    switch (b.actie) {
      case 'profiel': if (b.naam) D.bedrijf.naam = b.naam; if (b.logo !== undefined) D.bedrijf.logo = b.logo; if (b.branche) D.bedrijf.branche = b.branche; return { ok: true };
      case 'objecten': D.objecten = b.objecten; return { ok: true };
      case 'diensten': D.diensten = b.diensten; return { ok: true };
      case 'medewerker+':
        if (!b.naam || !login || !b.wachtwoord) throw new ApiError('Naam, login en wachtwoord zijn verplicht.', 400);
        if (b.wachtwoord.length < 8) throw new ApiError('Wachtwoord: minimaal 8 tekens.', 400);
        if (D.users.some(u => u.login === login)) throw new ApiError('Deze login bestaat al.', 409);
        D.users.push({ naam: b.naam, pnr: b.pnr || '', login, rol: 'medewerker' }); return { ok: true };
      case 'medewerker-': {
        const u = D.users.find(x => x.login === login);
        if (!u) throw new ApiError('Medewerker niet gevonden.', 404);
        if (u.rol === 'beheerder') throw new ApiError('De beheerder kan niet worden verwijderd.', 400);
        D.users = D.users.filter(x => x !== u); return { ok: true };
      }
      case 'wachtwoord': if (!b.wachtwoord || b.wachtwoord.length < 8) throw new ApiError('Wachtwoord: minimaal 8 tekens.', 400); return { ok: true };
      case 'portaal': {
        const o = D.objecten.find(x => x.naam === b.objectNaam);
        if (!o) throw new ApiError('Object niet gevonden.', 404);
        o.portaal = o.portaal || 'demo'; return { ok: true, token: o.portaal };
      }
    }
    throw new ApiError('Onbekende actie.', 400);
  }
  if (path === 'rapporten') {
    if (!b) {
      if (q.get('nummer')) { const r = D.rapporten[q.get('nummer')]; if (!r) throw new ApiError('Rapport niet gevonden.', 404); return r; }
      return { rapporten: D.order.map(n => D.rapporten[n]).filter(Boolean).map(summaryOf) };
    }
    if (b.actie === 'verwijderen') { delete D.rapporten[b.nummer]; D.order = D.order.filter(n => n !== b.nummer); return { ok: true }; }
    const r = b.rapport;
    r.door = ME.login; r.aangemaakt = new Date().toISOString(); D.seq++;
    r.nummer = `${D.bedrijf.id}-${CODE[r.type]}-${(r.datum || todayISO()).replace(/-/g, '')}-${String(D.seq).padStart(3, '0')}`;
    D.rapporten[r.nummer] = r; D.order.unshift(r.nummer);
    return { ok: true, nummer: r.nummer };
  }
  throw new ApiError('Niet beschikbaar in de demo.', 400);
}

        : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()) ? 'Vul een geldig e-mailadres in.'
        : f.wachtwoord.length < 8 ? 'Het wachtwoord moet minimaal 8 tekens hebben.' : '');
    if (check) { err.textContent = check; return; }
    btn.disabled = true; btn.textContent = login ? 'Inloggen…' : 'Account aanmaken…';
    try {
      MODE = 'server';
      const d = login
        ? await serverApi('auth', { actie: 'login', gebruiker: f.gebruiker.trim(), wachtwoord: f.wachtwoord })
        : await serverApi('registreer', { bedrijf: f.bedrijf.trim(), naam: f.naam.trim(), email: f.email.trim(), wachtwoord: f.wachtwoord, branche: f.branche, website: f.website });
      await afterAuth(d, login ? f.gebruiker : f.email);
      if (!login) toast('Welkom! Zet eerst je locaties en team erin.');
    } catch (x) {
      MODE = null; TOKEN = null;
      err.textContent = x.message;
      btn.disabled = false; btn.textContent = login ? 'Inloggen' : 'Account aanmaken';
    }
  });
}

/* ═════════════ Router & schil ═════════════ */
function route() {
  document.body.classList.add('app');
  closeModal();
  const h = location.hash.replace(/^#\/?/, '') || 'overzicht';
  const [p, a] = h.split('/');
  window.scrollTo(0, 0);

  if (adminOnly.includes(p) && !isAdmin()) return go('overzicht');

/* ═════════════ Rapport maken ═════════════ */
const DRAFT_KEY = () => `ois_concept_${MODE}_${ME.login}`;

function roundPoints(o) {

}
function newDraft(type) {

  const o = OBJ[0], d = new Date();

  return {
    type, naam: me?.naam || '', pnr: me?.pnr || '', object: o?.naam || '', adres: o?.adres || '', email: o?.email || '',
    dienstnaam: dn?.naam || '', datum: todayISO(d), van: dn?.van || nowHM(d), tot: dn?.tot || '', handtekening: null,
    mutaties: type === 'dienst' ? [{ tijd: nowHM(d), oms: '', gps: null }] : undefined,
    overdracht: type === 'dienst' ? '' : undefined,
    incident: type === 'incident' ? { cat: L().cats[0], tijd: nowHM(d), loc: '', prio: 'Middel', oms: '', actie: '', betrok: '', vervolg: '', politie: false, hulp: false, schade: false, fotos: [] } : undefined,
    ronde: type === 'ronde' ? { start: '', eind: '', punten: roundPoints(o) } : undefined

}
let saveDraftT;

  clearTimeout(saveDraftT);
  saveDraftT = setTimeout(flushDraft, 400);
}
function flushDraft() { if (!draft) return; clearTimeout(saveDraftT); const ok = Store.set(DRAFT_KEY(), { ...draft, _t: Date.now() }); if (!ok && draft.incident?.fotos?.length) Store.set(DRAFT_KEY(), { ...draft, incident: { ...draft.incident, fotos: [] }, _t: Date.now() }); }
window.addEventListener('pagehide', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
function draftHasContent(d) {
  return d && ((d.mutaties || []).some(m => m.oms) || d.overdracht || d.incident?.oms || (d.ronde?.punten || []).some(p => p.tijd || p.opm) || d.handtekening);
}
function opt(v, label, sel) { return `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(label)}</option>`; }

function editor(type) {
  if (!['dienst', 'incident', 'ronde'].includes(type)) return go('nieuw');

function startRound() { if (draft.ronde && !draft.ronde.start) { draft.ronde.start = nowHM(); const el = $('[data-f="ronde.start"]'); if (el) el.value = draft.ronde.start; } }

function getGPS() {

async function stampCp(n, scanned) {

  startRound(); renderCps(); keepDraft();
  const g = await getGPS();

}
function onScan(code) {
  const m = /^oisecur:cp:([^:]+):([^:]+)$/i.exec(code.trim());
  if (!m) return toast('Dit is geen Oisecur-checkpoint.', true);
  const cpId = m[2];
  const o = objByName(draft.object);
  const cp = (o?.checkpoints || []).find(c => c.id === cpId);
  if (!cp) {
    const other = OBJ.find(x => (x.checkpoints || []).some(c => c.id === cpId));
    return toast(other ? `Dit checkpoint hoort bij ${other.naam}.` : 'Onbekend checkpoint.', true);
  }
  let n = draft.ronde.punten.findIndex(p => p.cpId === cpId || p.naam === cp.naam);
  if (n < 0) { draft.ronde.punten.push({ naam: cp.naam, cpId, status: 'OK', opm: '', qr: true, tijd: '', gps: null }); n = draft.ronde.punten.length - 1; }

}
function validate(r) {
  const l = L();

  if (!r.object) return `Kies een ${l.object.toLowerCase()}.`;
  if (!r.datum) return 'Vul een datum in.';
  if (r.type === 'dienst' && !r.mutaties.length) return 'Voeg minimaal één regel toe.';
  if (r.type === 'incident' && !r.incident.oms) return 'Vul een omschrijving in.';
  if (r.type === 'ronde' && !r.ronde.punten.length) return 'Voeg minimaal één checkpoint toe.';
  if (r.type === 'ronde') { const bad = r.ronde.punten.find(p => p.status === 'Afwijking' && !p.opm); if (bad) return `Checkpoint "${bad.naam}": vul een opmerking in bij de afwijking.`; }

}
async function submitReport() {
  const r = clone(draft);
  if (r.mutaties) r.mutaties = r.mutaties.map(m => ({ ...m, oms: m.oms.trim() })).filter(m => m.oms);
  if (r.ronde) {
    r.ronde.punten = r.ronde.punten.map(p => ({ naam: p.naam.trim(), status: p.status, opm: p.opm.trim(), qr: !!p.qr, tijd: p.tijd, gps: p.gps })).filter(p => p.naam);
    if (!r.ronde.eind) r.ronde.eind = nowHM();
  }
  if (r.incident) ['loc', 'oms', 'actie', 'betrok', 'vervolg'].forEach(k => (r.incident[k] = (r.incident[k] || '').trim()));
  const err = validate(r);
  if (err) { toast(err, true); if (err.includes('handtekening')) $('#sig').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (!confirm('Rapport opslaan? Daarna krijgt het een nummer en kan het niet meer worden gewijzigd.')) return;
  const btn = $('[data-act=save]'); btn.disabled = true; btn.textContent = 'Opslaan…';

}

/* Handtekening */
function initSig() {
  const c = $('#sig'); if (!c) return;
  const fresh = c.cloneNode(); c.replaceWith(fresh);
  const cv = $('#sig'), ctx = cv.getContext('2d');
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  Object.assign(ctx, { lineWidth: 2.4, lineCap: 'round', lineJoin: 'round', strokeStyle: '#0d2456', fillStyle: '#0d2456' });
  if (draft.handtekening) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = draft.handtekening; }
  let drawing = false, last = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); drawing = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fill(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  const end = () => { if (!drawing) return; drawing = false; if (draft) { draft.handtekening = cv.toDataURL('image/png'); keepDraft(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
}

/* Afbeeldingen */
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function toCanvas(file, max) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    const s = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    return { c, im };
  } finally { URL.revokeObjectURL(url); }
}
async function photoData(file) {
  // De server bewaart foto's tot 500.000 tekens: verkleinen tot het past.
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    for (const [max, q] of [[1280, .72], [1024, .65], [800, .6], [640, .55]]) {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', q);
      if (d.length < 460000) return d;
    }
    throw new Error('te groot');
  } finally { URL.revokeObjectURL(url); }
}

const NAVY = [13, 36, 86];
const imgFmt = d => (/^data:image\/png/.test(d) ? 'PNG' : 'JPEG');
function pdfDoc() { const { jsPDF } = window.jspdf; return new jsPDF({ unit: 'mm', format: 'a4' }); }
function pdfHeader(doc, title, number, status) {
  let y = 12;
  if (B.logo) { try { const p = doc.getImageProperties(B.logo); const h = 16, w = Math.min(55, p.width * h / p.height); doc.addImage(B.logo, imgFmt(B.logo), 14, y, w, h); } catch (e) {} }

  doc.setFont('courier', 'normal'); doc.setFontSize(9); doc.setTextColor(90);

    const w = doc.getTextWidth(t) + 5; doc.setDrawColor(...NAVY); doc.setLineWidth(0.5); doc.setTextColor(...NAVY);
    doc.rect(196 - w, y - 3.6, w, 5); doc.text(t, 196 - w / 2, y, { align: 'center' });
  }
  y += 3; doc.setDrawColor(...NAVY); doc.setLineWidth(0.8); doc.line(14, y, 196, y);

}

    kv(pairs) {

          const x = 14 + j * 92;

          doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(25); doc.text(lines, x, o.y + 4.8);
        });

    },
    para(label, text) {
      if (!text) return;

      const lines = doc.splitTextToSize(String(text), 182);
      o.ensure(10);
      doc.setFontSize(8.5); doc.setTextColor(120); doc.text(label, 14, o.y); o.y += 4.8;
      doc.setFontSize(10); doc.setTextColor(25);
      lines.forEach(ln => { o.ensure(5); doc.text(ln, 14, o.y); o.y += 4.8; });
      o.y += 3;
    },
    rows(cols, data) {
      const head = () => {
        o.ensure(9); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...NAVY);
        let x = 14; cols.forEach(c => { doc.text(c.t.toUpperCase(), x + 1, o.y); x += c.w; });
        o.y += 2; doc.setDrawColor(...NAVY); doc.setLineWidth(0.4); doc.line(14, o.y, 196, o.y); o.y += 5;
      };
      head();
      data.forEach(row => {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
        const split = row.map((v, i) => doc.splitTextToSize(String(v ?? ''), cols[i].w - 2));
        const h = Math.max(1, ...split.map(s => s.length)) * 4.5;

        let x = 14; split.forEach((s, i) => { doc.setTextColor(...(cols[i].color?.(row) || [25, 25, 25])); doc.text(s, x + 1, o.y); x += cols[i].w; });
        o.y += h - 1.5; doc.setDrawColor(225); doc.setLineWidth(0.2); doc.line(14, o.y, 196, o.y); o.y += 4.5;
      });
      o.y += 2;
    },
    photos(list) {
      if (!list.length) return;

      let col = 0, rowH = 0;
      list.forEach(src => {
        let p; try { p = doc.getImageProperties(src); } catch (e) { return; }
        let w = 88, h = w * p.height / p.width; if (h > 100) { h = 100; w = h * p.width / p.height; }
        if (col === 0) o.ensure(104);
        try { doc.addImage(src, imgFmt(src), 14 + col * 94, o.y, w, h); } catch (e) {}
        rowH = Math.max(rowH, h); col++;
        if (col === 2) { col = 0; o.y += rowH + 5; rowH = 0; }
      });
      if (col) o.y += rowH + 5;
    },
    sign(r) {

      doc.text(`${r.naam || ''}${r.pnr ? ' (' + r.pnr + ')' : ''}`, 14, o.y + 28);

      o.y += 38;
    }

}
function pdfFooter(doc, label) {

function reportPdf(r) {

function overviewPdf(obj, from, to, rs) {
  const l = L();
  rs = rs.slice().sort((a, b) => (a.datum + (a.van || '')).localeCompare(b.datum + (b.van || '')));
  const doc = pdfDoc();
  const w = writer(doc, pdfHeader(doc, 'Overzicht rapportages', `${fmtDate(from)} t/m ${fmtDate(to)}`, ''));
  const cnt = t => rs.filter(r => r.type === t).length;
  const afw = rs.filter(r => r.type === 'ronde').reduce((n, r) => n + ((r.ronde || {}).punten || []).filter(p => p.status === 'Afwijking').length, 0);
  w.kv([[l.object, obj || `Alle ${l.objecten.toLowerCase()}`], ['Periode', `${fmtDate(from)} t/m ${fmtDate(to)}`],
    [l.types.dienst, String(cnt('dienst'))], [l.types.incident, String(cnt('incident'))], [l.types.ronde, String(cnt('ronde'))], ['Afwijkingen bij rondes', String(afw)]]);
  const inc = rs.filter(r => r.type === 'incident');
  if (inc.length) {
    w.h2(`${l.types.incident} in deze periode`);
    w.rows([{ t: 'Datum', w: 22 }, { t: 'Categorie', w: 36 }, { t: 'Prio', w: 16 }, { t: 'Locatie', w: 36 }, { t: 'Omschrijving', w: 72 }],
      inc.map(r => [fmtDate(r.datum) + '\n' + (r.incident?.tijd || ''), r.incident?.cat, r.incident?.prio, (obj ? '' : r.object + ' · ') + (r.incident?.loc || ''), r.incident?.oms]));
  }
  w.h2('Alle rapporten');
  const sum = r => r.type === 'dienst' ? `${(r.mutaties || []).length} regels${r.overdracht ? ' · ' + r.overdracht : ''}`
    : r.type === 'ronde' ? `${((r.ronde || {}).punten || []).filter(p => p.status === 'OK').length}/${((r.ronde || {}).punten || []).length} in orde`
    : `${r.incident?.cat || ''}: ${r.incident?.oms || ''}`;
  w.rows([{ t: 'Datum', w: 22 }, { t: 'Nummer', w: 44 }, { t: 'Soort', w: 28 }, { t: l.persoon, w: 30 }, { t: 'Samenvatting', w: 58 }],
    rs.map(r => [fmtDate(r.datum), r.nummer, l.types[r.type], r.naam, (obj ? '' : r.object + ': ') + sum(r)]));
  pdfFooter(doc, `Overzicht ${fmtDate(from)} t/m ${fmtDate(to)}`);
  return doc;
}

function qrDataUrl(text) {
  const div = document.createElement('div');
  new QRCode(div, { text, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
  const c = div.querySelector('canvas');
  return c ? c.toDataURL('image/png') : div.querySelector('img')?.src;
}
function qrSheet(objNaam, cps) {
  if (!window.QRCode) throw new Error('QR-module niet geladen');
  const doc = pdfDoc();
  cps.forEach((c, i) => {
    if (i && i % 4 === 0) doc.addPage();
    const k = i % 4, x = 14 + (k % 2) * 93, y = 14 + Math.floor(k / 2) * 138;
    doc.setDrawColor(180); doc.setLineWidth(0.3); doc.setLineDashPattern([2, 2], 0); doc.rect(x, y, 89, 132); doc.setLineDashPattern([], 0);
    doc.setFillColor(...NAVY); doc.rect(x, y, 89, 16, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(255); doc.text('CHECKPOINT', x + 44.5, y + 10.3, { align: 'center' });
    doc.addImage(qrDataUrl(`oisecur:cp:${B.id}:${c.id}`), 'PNG', x + 12, y + 22, 65, 65);
    doc.setTextColor(20); doc.setFontSize(15); doc.text(doc.splitTextToSize(c.naam, 80), x + 44.5, y + 99, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90); doc.text(doc.splitTextToSize(`${objNaam} · ${B.naam}`, 80), x + 44.5, y + 115, { align: 'center' });
    doc.setFontSize(7.5); doc.text(`Scan met de Oisecur-app · ${c.id}`, x + 44.5, y + 127, { align: 'center' });
  });
  return doc;
}

      <div class="list" id="d-list" style="margin-top:12px">${DIENST.map((d, n) => `<div class="item"><div class="grow"><b>${esc(d.naam)}</b><small class="mono">${esc(d.van)} – ${esc(d.tot)}</small></div><button class="x" data-rm="${n}" aria-label="Verwijderen">×</button></div>`).join('') || '<p class="muted">Nog geen diensten.</p>'}</div>
      <form id="f-dienst" class="grid3" style="margin-top:12px;align-items:end"><label>Naam<input name="naam" placeholder="bijv. Weekenddienst"></label><div class="grid2 keep"><label>Van<input type="time" name="van"></label><label>Tot<input type="time" name="tot"></label></div><button class="btn btn-ghost">Toevoegen</button></form>
    </section>
    <section class="card"><h2>Export</h2>
      <p class="muted" style="font-size:14px">Download al je rapporten als bestand, voor je eigen archief.</p>
      <div class="row" style="margin-top:12px"><button class="btn btn-ghost sm" id="s-exp">Alle rapporten downloaden (JSON)</button></div>
    </section>` : ''}
    <section class="card"><h2>Account</h2>
      <p class="muted" style="font-size:14px">${MODE === 'demo' ? 'Je bekijkt de demo. Niets wordt bewaard of verstuurd.' : `Ingelogd als <b style="color:var(--txt)">${esc(ME.naam)}</b> (${esc(ME.login)}) · ${admin ? 'beheerder' : L().persoon.toLowerCase()} bij ${esc(B.naam)}.`}</p>
      <div class="row" style="margin-top:12px">${MODE === 'demo' ? '<a class="btn btn-primary sm" href="app.html?registreer=1">Zelf beginnen</a>' : ''}<button class="btn btn-ghost sm" id="s-out">${MODE === 'demo' ? 'Demo sluiten' : 'Uitloggen'}</button></div>
    </section>
    <p class="hint" style="text-align:center;margin-top:20px">Oisecur · <a href="/" style="color:var(--muted)">oisecur.nl</a> · <a href="mailto:info@oisecur.nl" style="color:var(--muted)">info@oisecur.nl</a></p>`);
  $('#s-out').onclick = logout;
  if (!admin) return;
  $('#f-bedrijf').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    if (!f.naam.trim()) return toast('Vul een bedrijfsnaam in.', true);
    try { await call('stamdata', { actie: 'profiel', naam: f.naam.trim(), branche: f.branche }); B.naam = f.naam.trim(); B.branche = f.branche; toast('Opgeslagen'); viewSettings(); }
    catch (x) { toast(x.message, true); }
  };
  $('#s-logo').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    try {
      let data = '';
      for (const max of [480, 360, 260]) {
        const { c, im } = await toCanvas(file, max);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        data = c.toDataURL('image/png'); if (data.length < 290000) break;
      }
      if (data.length >= 290000) return toast('Dit logo is te groot. Probeer een kleinere afbeelding.', true);
      await call('stamdata', { actie: 'profiel', logo: data }); B.logo = data; toast('Logo opgeslagen'); viewSettings();
    } catch (x) { toast(x.message || 'Dit bestand kon niet worden gelezen', true); }
  };
  const rm = $('#s-logo-rm'); if (rm) rm.onclick = async () => { try { await call('stamdata', { actie: 'profiel', logo: '' }); B.logo = ''; viewSettings(); } catch (x) { toast(x.message, true); } };
  $('#d-list').addEventListener('click', async e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    const list = DIENST.filter((_, n) => n !== +b.dataset.rm);
    try { await call('stamdata', { actie: 'diensten', diensten: list }); DIENST = list; viewSettings(); } catch (x) { toast(x.message, true); }
  });
  $('#f-dienst').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    if (!f.naam.trim() || !f.van || !f.tot) return toast('Vul naam, van- en tot-tijd in.', true);
    const list = [...DIENST, { naam: f.naam.trim(), van: f.van, tot: f.tot }];
    try { await call('stamdata', { actie: 'diensten', diensten: list }); DIENST = list; toast('Dienst toegevoegd'); viewSettings(); } catch (x) { toast(x.message, true); }
  };
  $('#s-exp').onclick = async e => {
    if (!LIST.length) return toast('Nog geen rapporten om te downloaden.', true);
    const btn = e.target; btn.disabled = true;
    try {
      const all = [];
      for (let n = 0; n < LIST.length; n++) { btn.textContent = `Ophalen ${n + 1}/${LIST.length}…`; all.push(await getReport(LIST[n].nummer)); }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' }));
      a.download = `${(B.id || 'oisecur').toLowerCase()}-rapporten-${todayISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (x) { toast(x.message, true); }
    btn.disabled = false; btn.textContent = 'Alle rapporten downloaden (JSON)';
  };
}

/* ═════════════ Modal en QR-scanner ═════════════ */
let scan = null;
function openModal(html) {
  const m = $('#modal'); m.innerHTML = `<div class="modal-box">${html}</div>`; m.hidden = false;
  m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) closeModal(); };
}
function closeModal() {
  if (scan) { cancelAnimationFrame(scan.raf); scan.stream?.getTracks().forEach(t => t.stop()); scan = null; }
  const m = $('#modal'); if (m) { m.hidden = true; m.innerHTML = ''; }
}
async function openScanner(onCode) {
  if (!window.jsQR) return toast('QR-scanner niet geladen. Controleer je internetverbinding.', true);
  if (!navigator.mediaDevices?.getUserMedia) return toast('Deze browser ondersteunt geen camera. Gebruik "⌖ Nu" bij het checkpoint.', true);
  openModal(`<h2>Scan checkpoint</h2><p class="muted" style="font-size:14px">Richt de camera op de QR-code van het checkpoint.</p>
    <div class="scanwrap"><video id="sv" playsinline muted></video></div><button type="button" class="btn btn-ghost block" data-close>Annuleren</button>`);
  const me = scan = { raf: 0, stream: null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    if (scan !== me) { stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $('#sv'); v.srcObject = stream; await v.play();
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    const tick = () => {
      if (scan !== me) return;
      if (v.readyState >= 2 && v.videoWidth) {
        const s = Math.min(1, 640 / v.videoWidth); c.width = v.videoWidth * s | 0; c.height = v.videoHeight * s | 0;
        ctx.drawImage(v, 0, 0, c.width, c.height);
        const code = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
        if (code?.data) { if (navigator.vibrate) navigator.vibrate(80); closeModal(); onCode(code.data); return; }
      }
      me.raf = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    if (scan === me) { closeModal(); toast('Geen toegang tot de camera. Geef toestemming of gebruik "⌖ Nu" bij het checkpoint.', true); }
  }
}

/* ═════════════ Demodata ═════════════ */
function demoSignature() {
  const c = document.createElement('canvas'); c.width = 520; c.height = 180;
  const x = c.getContext('2d'); x.strokeStyle = '#0d2456'; x.lineWidth = 4; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(40, 120);
  x.bezierCurveTo(70, 20, 110, 30, 100, 110); x.bezierCurveTo(95, 150, 150, 60, 175, 95);
  x.bezierCurveTo(195, 125, 215, 70, 240, 90); x.bezierCurveTo(262, 110, 280, 60, 310, 80);
  x.bezierCurveTo(340, 100, 360, 120, 400, 70); x.bezierCurveTo(420, 50, 440, 110, 480, 95);
  x.stroke(); x.beginPath(); x.moveTo(60, 140); x.lineTo(460, 132); x.lineWidth = 2.5; x.stroke();
  return c.toDataURL('image/png');
}
function demoPhoto(title, sub, hue) {
  const c = document.createElement('canvas'); c.width = 800; c.height = 600; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 800, 600); g.addColorStop(0, `hsl(${hue},18%,32%)`); g.addColorStop(1, `hsl(${hue},14%,16%)`);
  x.fillStyle = g; x.fillRect(0, 0, 800, 600);
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 6;
  for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(60 + i * 85, 150); x.lineTo(60 + i * 85, 520); x.stroke(); }
  x.beginPath(); x.moveTo(40, 190); x.lineTo(760, 190); x.moveTo(40, 480); x.lineTo(760, 480); x.stroke();
  x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, 520, 800, 80);
  x.fillStyle = '#fff'; x.font = 'bold 34px sans-serif'; x.fillText(title, 28, 562); x.font = '22px sans-serif'; x.fillStyle = '#ddd'; x.fillText(sub, 28, 590);
  return c.toDataURL('image/jpeg', 0.8);
}
